<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예준이대전쟁</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game">
  <div id="topbar">
    <div id="stageName">예준이 대전쟁</div>
    <div class="btns">
      <button class="tbtn" id="speedBtn">x1</button>
      <button class="tbtn" id="pauseBtn">⏸ 정지</button>
    </div>
  </div>
  <canvas id="field" width="960" height="400"></canvas>
  <div id="hud">
    <div id="moneyBox">
      <div id="moneyLabel">💰 <span id="moneyVal">0</span>/<span id="moneyMax">500</span> <span class="rate" id="moneyRate"></span></div>
      <div id="moneyBarWrap"><div id="moneyBar"></div></div>
      <button id="walletBtn">지갑 강화</button>
    </div>
    <div id="unitRow"></div>
    <button id="cannonBtn"><span>냥코 대포</span><span class="ckey">C 키</span>
      <div id="cannonBarWrap"><div id="cannonBar"></div></div></button>
  </div>
  <div id="hint">숫자키 1~9: 출격 · Q: 지갑 강화 · C: 대포 · S: 배속 · P: 일시정지</div>
  <div id="overlay"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
